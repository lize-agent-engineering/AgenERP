name: gates

# CI 是唯一不可被本地绕过的一层：拿着 shell 的 AI 理论上能改本地门禁，
# 但改不了这里跑出来的结果。见 docs/masterplan/README.md 的 REF:GATE-PROTECT。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates-untouched:
    name: 门禁未被改动
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查本次改动是否触及 tests/gates/**
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
            # 新分支首次推送时 before 是全零
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "首次推送，跳过 diff 比对"; exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'tests/gates/**' || true)
          if [ -z "$CHANGED" ]; then
            echo "✅ 未触及 tests/gates/**"; exit 0
          fi
          echo "本次改动触及门禁："; echo "$CHANGED"
          # 人工批准是唯一放行方式：提交信息里带 trailer
          if git log --format=%B "$BASE..$HEAD" | grep -q '^Gates-Change-Approved-By:'; then
            echo "✅ 找到人工批准 trailer，放行"; exit 0
          fi
          echo "❌ 改动了门禁却没有人工批准。"
          echo "   门禁是裁判，loop 不得修改（AGENTS.md 红线 1）。"
          echo "   确实需要人改判据时，在提交信息里加一行：Gates-Change-Approved-By: <姓名>"
          exit 1

  expected-red-ratchet:
    name: 预期红名单只能变短
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 名单不得变长
        run: |
          set -euo pipefail
          FILE=tests/gates/EXPECTED_RED.txt
          count() { grep -vE '^\s*(#|$)' | wc -l | tr -d ' '; }
          NOW=$(count < "$FILE")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "首次推送，基线即当前 ($NOW 条)"; exit 0
            fi
          fi
          if ! git cat-file -e "$BASE:$FILE" 2>/dev/null; then
            echo "基线里还没有这个文件，跳过"; exit 0
          fi
          BEFORE=$(git show "$BASE:$FILE" | count)
          echo "预期红：$BEFORE → $NOW"
          if [ "$NOW" -le "$BEFORE" ]; then
            echo "✅ 名单没有变长"; exit 0
          fi
          if git log --format=%B "$BASE..${{ github.sha }}" | grep -q '^Gates-Change-Approved-By:'; then
            echo "✅ 名单变长，但有人工批准，放行"; exit 0
          fi
          echo "❌ 预期红名单变长了（$BEFORE → $NOW）——这等于把一个真失败登记成「预期」。"
          echo "   棘轮只允许变短。确需放宽由人批准：Gates-Change-Approved-By: <姓名>"
          exit 1

  gates-l1:
    name: L1 快门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: 门禁结果必须与预期红名单一致
        run: python3 tools/gates/check_expected_red.py

  masterplan-links:
    name: 主计划引用不断链
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: T2 断链校验
        run: |
          set -euo pipefail
          # CI 里没有证据仓；只校验仓内 M 类引用，E 类（${XM}）跳过
          bash tools/check-masterplan-links.sh || {
            echo "提示：若失败仅因证据仓缺失（E 类引用），属预期；M 类断链才是真问题"
            exit 1
          }

  roadmap-parseable:
    name: roadmap 引擎可解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Work Item Status 块必须存在且可解析
        run: |
          set -euo pipefail
          grep -q '^## Work Item Status' docs/backlog/implementation-roadmap.md \
            || { echo "❌ roadmap 缺少硬契约标题 '## Work Item Status'"; exit 1; }
          echo "✅ 硬契约标题在"
