name: gates

# CI 是唯一不可被本地绕过的一层：拿着 shell 的 AI 理论上能改本地门禁，
# 但改不了这里跑出来的结果。见 docs/masterplan/README.md 的 REF:GATE-PROTECT。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates-untouched:
    name: 门禁未被改动
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查本次改动是否触及 tests/gates/**
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
            # 新分支首次推送时 before 是全零
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "首次推送，跳过 diff 比对"; exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'tests/gates/**' || true)
          if [ -z "$CHANGED" ]; then
            echo "✅ 未触及 tests/gates/**"; exit 0
          fi
          echo "本次改动触及门禁："; echo "$CHANGED"
          # 人工批准是唯一放行方式：提交信息里带 trailer
          if git log --format=%B "$BASE..$HEAD" | grep -q '^Gates-Change-Approved-By:'; then
            echo "✅ 找到人工批准 trailer，放行"; exit 0
          fi
          echo "❌ 改动了门禁却没有人工批准。"
          echo "   门禁是裁判，loop 不得修改（AGENTS.md 红线 1）。"
          echo "   确实需要人改判据时，在提交信息里加一行：Gates-Change-Approved-By: <姓名>"
          exit 1

  expected-red-ratchet:
    name: 预期红名单只能变短
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 名单不得变长
        run: |
          set -euo pipefail
          FILE=tools/gates/expected-red.txt
          # grep -v 匹配不到任何行时退出码 1，配 `set -o pipefail` 会让整条管道失败、
          # 脚本当场终止 —— 也就是说：**名单真的缩到零的那一刻，守卫它的闸自己崩**。
          # 实测 2026-08-23：名单 7 → 0 时本 job 无任何输出直接 exit 1。用 `|| true` 兜住。
          count() { local n; n=$(grep -vcE '^\s*(#|$)' "${1:-/dev/stdin}" || true); echo "${n:-0}"; }
          NOW=$(count "$FILE")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "首次推送，基线即当前 ($NOW 条)"; exit 0
            fi
          fi
          if ! git cat-file -e "$BASE:$FILE" 2>/dev/null; then
            echo "基线里还没有这个文件，跳过"; exit 0
          fi
          BEFORE=$(git show "$BASE:$FILE" > /tmp/before-red.txt && count /tmp/before-red.txt)
          echo "预期红：$BEFORE → $NOW"
          if [ "$NOW" -le "$BEFORE" ]; then
            echo "✅ 名单没有变长"; exit 0
          fi
          if git log --format=%B "$BASE..${{ github.sha }}" | grep -q '^Gates-Change-Approved-By:'; then
            echo "✅ 名单变长，但有人工批准，放行"; exit 0
          fi
          echo "❌ 预期红名单变长了（$BEFORE → $NOW）——这等于把一个真失败登记成「预期」。"
          echo "   棘轮只允许变短。确需放宽由人批准：Gates-Change-Approved-By: <姓名>"
          exit 1

  gates-l1:
    name: L1 快门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 装本仓自身的运行期依赖，不只是 pytest。
      # 只装 pytest 会让「本机碰巧装着某个库」变成 CI 绿而线上红 ——
      # 2026-08-24 实测踩到：certifi 从未被声明为依赖，本机碰巧有，
      # 直到 tests/routing 进 CI 才在 runner 上 ModuleNotFoundError。
      # 不用 `-e .`：那要跑构建后端，多一层能失败的东西；直接读 pyproject 的
      # dependencies 装，判据更直接。
      - run: pip install pytest certifi
      - name: 门禁结果必须与预期红名单一致
        run: python3 tools/gates/check_expected_red.py

  masterplan-links:
    name: 主计划引用不断链
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: T2 断链校验
        run: |
          set -euo pipefail
          # CI 里没有证据仓；只校验仓内 M 类引用，E 类（${XM}）跳过
          bash tools/check-masterplan-links.sh || {
            echo "提示：若失败仅因证据仓缺失（E 类引用），属预期；M 类断链才是真问题"
            exit 1
          }

  roadmap-parseable:
    name: roadmap 引擎可解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Work Item Status 块必须存在且可解析
        run: |
          set -euo pipefail
          grep -q '^## Work Item Status' docs/backlog/implementation-roadmap.md \
            || { echo "❌ roadmap 缺少硬契约标题 '## Work Item Status'"; exit 1; }
          echo "✅ 硬契约标题在"

  loop-wiring:
    name: 循环联动冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 门禁判定 → 循环反应，三条链
        run: bash tools/gates/smoke-loop-wiring.sh

  # L2 慢门禁：真的在 runner 上把栈拉起来跑一次「零依赖启动」。
  # 加它的理由：本仓所有 live 证据此前都带着「只在本机做过」的限定，而工作项 8 的名字
  # 就是「零依赖启动**进 CI**」。见 plan docs/plans/p0-foundation/2026-08-21-2220-2-…。
  #
  # ⚠️ 残余风险，写在这里而不是只写在文档里：本 job **不跑 tools/gates/check_expected_red.py**，
  #    而是直接对 pytest 的退出码做判定。原因是判定环境不同——默认环境没有 AGENERP_LIVE，
  #    L2 在那里恒红，名单如实登记着它们；而本 job 在 live 判定环境下跑，那几条是绿的，
  #    判定器会报「名单内的门禁却绿了」并退 1，两个 job 互相拆台。
  #    **代价**：这几条门禁在 CI 上不受预期红名单棘轮保护。代偿控制是上面的 gates-untouched job
  #    ——那几条断言就在 tests/gates/** 内，改它们要人工批准 trailer。
  #    真正的修法是给判定器加「live 名单」，那属判据设施改造，超出本 plan（已登记 Deferred）。
  gates-l2:
    name: L2 慢门禁（零依赖启动）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 装本仓自身的运行期依赖，不只是 pytest。
      # 只装 pytest 会让「本机碰巧装着某个库」变成 CI 绿而线上红 ——
      # 2026-08-24 实测踩到：certifi 从未被声明为依赖，本机碰巧有，
      # 直到 tests/routing 进 CI 才在 runner 上 ModuleNotFoundError。
      # 不用 `-e .`：那要跑构建后端，多一层能失败的东西；直接读 pyproject 的
      # dependencies 装，判据更直接。
      - run: pip install pytest certifi

      # runner 与本机的 compose 版本差是 plan 1022-1 登记的 watch-only residual，
      # 每次都把版本打出来，差异出现时能直接比对，不用回头猜。
      - name: runner 上的 docker / compose 版本
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version

      # --wait-timeout 取 900 而不是本机的 300：口径依据没变（system-baseline.md §14.2 的
      # 「interval × retries + start_period 必须小于 wait-timeout」，本仓最大值约 120 秒），
      # 放大的那部分只覆盖 runner 上更慢的拉镜像与建站，不放松任何判定。
      - name: 起栈（一个 AI 变量都不配）
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 900

      # 这条门禁只取 compose_stack、不取 live_site，因此不需要 AGENERP_SITE / AGENERP_SITE_URL。
      # 端口不设：fixture 从跑着的栈上观测 frontend 的实际发布端口。
      - name: L2 门禁 —— 零依赖启动
        env:
          AGENERP_LIVE: "1"
          AGENERP_ADMIN_PASSWORD: admin
        run: python3 -m pytest tests/gates/test_zero_dep_boot.py -q

      - name: 引导服务日志（失败时最先要看的东西）
        if: always()
        run: docker compose -f docker-compose.yml logs bootstrap-homepage --no-log-prefix

      - name: 拆栈（无条件）
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # L2 全量 live 判定：在 runner 上起栈，然后用**判定器**对全部 19 条门禁做一次判定。
  # 加它的理由：工作项 9 的判据是「L2 的判定与 CI 覆盖」，而在它之前本仓所有 live 全绿证据
  # 都带着「只在本机做过」的限定。见 plan docs/plans/p0-foundation/2026-08-22-0027-2-…。
  #
  # 与上面 gates-l2 的关系是**包含**，不是并列：gates-l2 只跑 test_zero_dep_boot.py 三条，
  # 本 job 跑的 19 条完全包住它。两者因此冗余。**没有就地合并/替换 gates-l2**，是因为本仓对红线 2
  # 的自查已固化成「新文件以旧文件为行前缀」——改现有 job 会直接打掉那条机械判据，
  # 此后每一轮都要重新论证「这次的改动不算变松」。退休 gates-l2 是删除动作，已登记为人动作 Deferred。
  #
  # 与 gates-l2 的另一处差别：本 job 走 tools/gates/check_expected_red.py 而不是裸 pytest。
  # live 模式的契约是「全部绿、零 red、零 skip」，比预期红名单棘轮更紧——棘轮只拦「名单变长」，
  # live 契约连一条 skip 都不放过。gates-l2 注释里那条「L2 在 CI 上不受棘轮保护」的残余风险，
  # 在本 job 的覆盖面（19 条全部）上因此收口。判定契约本身见 system-baseline.md §14.4。
  #
  # ⚠️ AGENERP_SITE 是 job 级的，它有一个副作用：把 test_snapshot_diff_structured.py 的
  #    ::test_two_snapshots_of_unchanged_site_diff_empty 与 ::test_diff_is_structured_not_text
  #    从离线来源翻到活站点上（这两条不取 fixture、直接调 capture()，只能由 env 供给站点）。
  #    实测影响面恰好只有这两条。两条在 gates-l1 里仍按离线判定，两处判据来源不同。
  gates-l2-live:
    name: L2 全量 live 判定（全部门禁，零 skip）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 不可省：check_expected_red.py 用 sys.executable -m pytest 起子进程，
      # pytest 必须装在这个解释器里。
      # 装本仓自身的运行期依赖，不只是 pytest。
      # 只装 pytest 会让「本机碰巧装着某个库」变成 CI 绿而线上红 ——
      # 2026-08-24 实测踩到：certifi 从未被声明为依赖，本机碰巧有，
      # 直到 tests/routing 进 CI 才在 runner 上 ModuleNotFoundError。
      # 不用 `-e .`：那要跑构建后端，多一层能失败的东西；直接读 pyproject 的
      # dependencies 装，判据更直接。
      - run: pip install pytest certifi

      - name: runner 上的 docker / compose 版本
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          docker compose version

      # --wait-timeout 沿用 gates-l2 已实证的 900，口径依据见 system-baseline.md §14.2。
      - name: 起栈（一个 AI 变量都不配）
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 900

      # AGENERP_HTTP_PORT 不设：走 compose 默认 127.0.0.1:8080，runner 上已实证空闲。
      # AGENERP_SITE_URL 是冗余而非新耦合——agenerp/site.py 的 default_base_url() 本来就回落到
      # DEFAULT_HTTP_PORT = "8080"，写出来只是更好读。
      # 装种子数据与受限身份。**不可省，也不许改成「把那道门禁摘出判定面」**：
      # 2026-08-24 实测踩到 —— 本 job 原本只起栈不装数据，而
      # `test_tool_execution_live.py` 要查 Bin / Sales Order / 受限身份，
      # 于是 8 条红。摘掉它能让 CI 变绿，但那是**把判据调整到迁就环境**，
      # 正好是判定器不该做的事（AGENTS.md 裁判规则）。补前置才是对的方向。
      - name: 前置 —— 装种子数据与受限身份
        env:
          AGENERP_WORKER_PASSWORD: ${{ secrets.AGENERP_WORKER_PASSWORD || 'worker-ci-only' }}
        run: |
          set -euo pipefail
          python3 -m agenerp.seedsite --load-masters --site frontend
          python3 -m agenerp.seedsite --load-documents --site frontend
          python3 -m agenerp.seedusers --load-users --site frontend

      - name: 全部门禁的 live 判定（条数由 check_expected_red.py 自己数）
        env:
          AGENERP_LIVE: "1"
          AGENERP_ADMIN_PASSWORD: admin
          AGENERP_SITE: frontend
          AGENERP_SITE_URL: http://127.0.0.1:8080
          # 工具执行层门禁的 permission.scope 判别力那条要以受限身份登录。
          # 缺它那条会红（**不是 skip** —— 门禁里没有 skip 这个出口）。
          AGENERP_WORKER_PASSWORD: ${{ secrets.AGENERP_WORKER_PASSWORD || 'worker-ci-only' }}
        run: python3 tools/gates/check_expected_red.py

      - name: 取证 —— 服务状态
        if: always()
        run: docker compose -f docker-compose.yml ps

      - name: 取证 —— backend 日志
        if: always()
        run: docker compose -f docker-compose.yml logs backend --tail 200

      - name: 取证 —— 引导服务日志
        if: always()
        run: docker compose -f docker-compose.yml logs bootstrap-homepage --no-log-prefix

      - name: 拆栈（无条件）
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # 判定器的 CI 侧守卫。加它的理由：AGENTS.md 裁判规则 1 把「测试过没过」的裁定权交给判定器的退出码，
  # 而在它之前三层既有保护没有一层覆盖判定器本身——gates-untouched 只 diff tests/gates/**、
  # gate-verify.mjs 的 PROTECTED = ["tests/gates/"]、expected-red-ratchet 只数账本行数。
  # 而 gates-l1 跑的就是判定器：判定器被改废之后会在 CI 上自证为绿。见 system-baseline.md §14.4。
  #
  # 脚本体与上面的 gates-untouched **同构**：同一套 BASE/HEAD 推导（pull_request 走 base.sha/head.sha，
  # push 走 event.before/sha）、同一个全零 sha（首次推送）分支、同一个 ^Gates-Change-Approved-By: 匹配式。
  # 唯一的差别是 diff 路径。两个 job 逻辑近似重复，已登记为人动作 Deferred；
  # 没有合并进 gates-untouched，同样是因为改它的脚本体会打掉行前缀自查。
  #
  # ⚠️ 硬边界：路径清单里**没有** tools/gates/expected-red.txt，这是刻意的。
  #    账本允许在同一提交里划短（AGENTS.md 红线 1 的「边界」句 + Protected Areas 表第 2 行
  #    allowed（只能变短）），服务端控制是上面的 expected-red-ratchet job。
  #    把账本圈进来会让**每一次合法的划短**在 CI 上失败。
  verdict-tool-untouched:
    name: 判定器未被改动
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查本次改动是否触及门禁判定器
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
            # 新分支首次推送时 before 是全零
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "首次推送，跳过 diff 比对"; exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'tools/gates/check_expected_red.py' 'tools/gates/gate-verify.mjs' || true)
          if [ -z "$CHANGED" ]; then
            echo "✅ 未触及判定器"; exit 0
          fi
          echo "本次改动触及判定器："; echo "$CHANGED"

          # ── 判据自身的可诊断性（2026-08-23）───────────────────────────
          # 本出口曾在**同一 sha、同一输入**上一红一绿（run 32570942284 attempt 1 exit 1
          # / attempt 2 exit 0）。根因**未证实**：怀疑过 `git log | grep -q` 在
          # `pipefail` 下吃 SIGPIPE(141)，但本地 10/10 未复现，故按 AGENTS.md 裁判
          # 规则 3 不认定根因。
          #
          # 处置不依赖根因，做两件事：
          #   ① **去掉管道**——先落盘再 grep，消掉 SIGPIPE 这个嫌疑面（即使它不是真凶，
          #      也不该留着一个能让判定器非确定的结构）。
          #   ② **把判定用到的全部输入打出来**——下次再抖时能逐字对比两次 attempt 的
          #      输入是否真的相同，而不是又记一条「不可复现」。
          echo "── 判定输入（用于诊断，勿删）──"
          echo "   BASE=$BASE"
          echo "   HEAD=$HEAD"
          git log --format=%B "$BASE..$HEAD" > /tmp/range-messages.txt
          echo "   范围内提交数=$(git rev-list --count "$BASE..$HEAD")"
          echo "   提交信息字节数=$(wc -c < /tmp/range-messages.txt)"
          echo "   trailer 命中行数=$(grep -c '^Gates-Change-Approved-By:' /tmp/range-messages.txt || true)"

          if grep -q '^Gates-Change-Approved-By:' /tmp/range-messages.txt; then
            echo "✅ 找到人工批准 trailer，放行"; exit 0
          fi
          echo "❌ 改动了门禁判定器却没有人工批准。"
          echo "   判定器产出的退出码是「测试过没过」的唯一裁定（AGENTS.md 裁判规则 1），"
          echo "   而 gates-l1 跑的就是它自己——改废了会在 CI 上自证为绿。"
          echo "   边界：tools/gates/expected-red.txt 不在此清单内。它是账本不是裁判，只能变短，"
          echo "   由 expected-red-ratchet job 管着。"
          echo "   确需人改判定器时，在提交信息里加一行：Gates-Change-Approved-By: <姓名>"
          exit 1

  # 种子链的 CI 覆盖（plan `2026-08-22-2325-2` 交付，口径见 system-baseline.md §14.5）。
  # 加它的理由：工作项 7 的 B 半（装载器 + 站点侧对账）此前**只在同一台本机**跑过，
  # 而本仓已有实测事实证明「本机绿 ≠ 全新站点绿」（run 32509351108 抓出的
  # ::test_no_orphan_column_left_behind，本机 6 跑只红 1 次、当时被记成不可复现）。
  # 全新 runner 站点是这条链**从未跑过**的输入。
  #
  # 本 job 判的是**四条 CLI 的退出码**，与 tests/gates/** 的 19 条互不重叠——
  # ⚠️ 它**不使**种子链的三条站点侧断言成为门禁：GATE_VERIFY 与
  #    tools/gates/check_expected_red.py 仍然复跑不到它们。两者不得混为一谈。
  #
  # ⚠️ --site 必须由 argv 给：agenerp/seedsite.py 的 main() 读的是 args.site，
  #    **根本不读 AGENERP_SITE**（那个变量归 snapshot.py / oob.py / pack.py / site.py）。
  #    不带 --site 时是 exit 2，四条命令因此每条都写死 --site frontend。
  #
  # ⚠️ 幂等断言锚在**合计行**上：DocLoadReport.lines() 每个 DocType 各打一行
  #    「{doctype}：新建 N / …」，裸 grep '新建 0' 会被任何一个「这轮没新建」的 DocType 命中，
  #    哪怕合计是「新建 7」。判据因此逐字写死为 ^合计：新建 0 （模块 docstring 的口径就是合计）。
  #
  # timeout-minutes 是刻意设的（不是模板噪音）：一个长期慢或抖的必过 job，
  # 正是将来「不如给它加个『失败也算过』的开关」的压力来源。预期墙钟见 §14.5。
  # （这条注释刻意不写出那个开关的字面名：红线 2 的机械自查是对新增段做裸 grep，
  #   一个出现在注释里的字面命中会让自查从「0 命中」退化成「命中 1 处，但那是注释」。）
  gates-l2-seed:
    name: L2 种子链（装载 + 站点侧对账）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENERP_SITE_URL: http://127.0.0.1:8080
      AGENERP_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: runner 上的 docker / compose 版本
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          docker compose version

      # --wait-timeout 沿用 gates-l2 / gates-l2-live 已实证的 900，口径依据见 system-baseline.md §14.2。
      - name: 起栈（一个 AI 变量都不配）
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 900

      - name: ① 装载主数据段
        run: python3 -m agenerp.seedsite --load-masters --site frontend

      - name: ② 装载业务单据段并提交
        run: python3 -m agenerp.seedsite --load-documents --site frontend

      # 幂等判据：原样复跑 ②，合计行必须是「新建 0」。
      - name: ③ 原样复跑 ② —— 幂等断言（合计行必须是「新建 0」）
        run: |
          set -euo pipefail
          python3 -m agenerp.seedsite --load-documents --site frontend | tee /tmp/seed-idempotent.log
          grep -qE '^合计：新建 0 ' /tmp/seed-idempotent.log

      - name: ④ 站点侧对账（30 项）
        run: python3 -m agenerp.seedsite --verify-site --site frontend

      # ⑤/⑥ 由 P1.0a 加入。挂在这个 job 上是因为它已经有一个装好数据的活站点，
      # 另起一个 job 等于把 ERPNext 再拉一遍（分钟级）换不来任何判别力。
      - name: ⑤ 装载受限身份（permission.scope 判别力的前置）
        env:
          AGENERP_WORKER_PASSWORD: ${{ secrets.AGENERP_WORKER_PASSWORD || 'worker-ci-only' }}
        run: python3 -m agenerp.seedusers --load-users --site frontend

      # ⚠️ 这条**不接受 skip**。没有受限身份时它红而不是跳 ——
      # 站点上只有 Administrator 时，一个永远回 True 的 permission.scope
      # 与正确实现在所有其它断言下长得一模一样。
      # ⑥ 要跑 pytest，而本 job 原本只跑 `python3 -m agenerp.*`，从来没装过。
      # 2026-08-24 实测踩到：加了 ⑥ 却没补这一步，runner 上
      # `No module named pytest`。certifi 同理（见 pyproject 的 dependencies）。
      - name: ⑥ 前置 —— 装 pytest 与本仓运行期依赖
        run: pip install pytest certifi

      - name: ⑥ L2 门禁 —— 工具执行层守约（12 条，零 skip）
        env:
          AGENERP_LIVE: "1"
          AGENERP_WORKER_PASSWORD: ${{ secrets.AGENERP_WORKER_PASSWORD || 'worker-ci-only' }}
        run: |
          set -euo pipefail
          python3 -m pytest tests/gates/test_tool_execution_live.py -q | tee /tmp/tool-gate.log
          # 判据自身的判据：跳过就是没跑，没跑就是红。
          if grep -qE '[0-9]+ skipped' /tmp/tool-gate.log; then
            echo "❌ 工具执行层门禁出现 skip —— 判定器不接受 skip，未跑就是红。" >&2
            exit 1
          fi

      # 取证一律 always()（不是 failure()）：cancel / timeout 路径上最需要证据，
      # 而 failure() 在那两种收场上不触发。
      - name: 取证 —— 服务状态
        if: always()
        run: docker compose -f docker-compose.yml ps

      - name: 取证 —— backend 日志
        if: always()
        run: docker compose -f docker-compose.yml logs backend --tail 200

      - name: 取证 —— 引导服务日志
        if: always()
        run: docker compose -f docker-compose.yml logs bootstrap-homepage --no-log-prefix

      - name: 拆栈（无条件）
        if: always()
        run: docker compose -f docker-compose.yml down -v

  unit-and-contracts:
    name: 单测与契约测试（全部离线判据）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 装本仓自身的运行期依赖，不只是 pytest。
      # 只装 pytest 会让「本机碰巧装着某个库」变成 CI 绿而线上红 ——
      # 2026-08-24 实测踩到：certifi 从未被声明为依赖，本机碰巧有，
      # 直到 tests/routing 进 CI 才在 runner 上 ModuleNotFoundError。
      # 不用 `-e .`：那要跑构建后端，多一层能失败的东西；直接读 pyproject 的
      # dependencies 装，判据更直接。
      - run: pip install pytest certifi

      - name: ① 单测（tests/unit）
        run: python3 -m pytest tests/unit -q

      - name: ② 契约测试（tests/contracts）
        run: python3 -m pytest tests/contracts -q

      # ③–⑥ 由人补（2026-08-24）。此前 CI 只跑 unit + contracts，而
      # tests/tools（61）· tests/routing（148）· tests/context（51）·
      # tests/experiments（10）**共 270 条判据一条都没进 CI** ——
      # 「本机跑过」与「CI 覆盖」是两件事，前者拦不住别人改坏。
      # 这几个目录由 loop 写在红线外，接进 CI 属红线 2，故由人做。
      - name: ③ 工具执行层（tests/tools）
        run: python3 -m pytest tests/tools -q

      - name: ④ 模型路由（tests/routing）
        run: python3 -m pytest tests/routing -q

      - name: ⑤ 上下文层（tests/context）
        run: python3 -m pytest tests/context -q

      - name: ⑥ 实验设施（tests/experiments）
        run: python3 -m pytest tests/experiments -q

      # 判据自身的判据：新增目录若忘了接进来，这一步会红。
      # 不写死条数——条数会长；写死目录集合，多出目录即红。
      - name: ⑦ 没有测试目录被漏在 CI 之外
        run: |
          set -euo pipefail
          COVERED="contracts context experiments fixtures gates routing tools unit"
          ACTUAL=$(ls -d tests/*/ | xargs -n1 basename | sort | tr '\n' ' ' | sed 's/ $//')
          EXPECTED=$(echo $COVERED | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ tests/ 下的目录集合变了，但 CI 没跟着改。" >&2
            echo "   CI 认识的： $EXPECTED" >&2
            echo "   仓里实际的： $ACTUAL" >&2
            echo "   新增目录必须显式接进本 job（或列入 COVERED 并说明为何不跑）。" >&2
            exit 1
          fi
          echo "✅ 测试目录集合与 CI 一致"

  seed-selfverify:
    name: 种子生成器自验（agenerp.seed --verify）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 判据是「退出码 + stdout 断言」两条，不是只判退出码：只判退出码时，把
      # agenerp/seed/__main__.py 的 `raise SystemExit(main())` 改成 `raise SystemExit(0)`
      # 会让本 job 静默退 0，而 tests/unit 直接 import main、从不经过那两行 —— 那是一条活的假绿路径。
      # `| tee` 会把退出码换成 tee 的，因此 `set -o pipefail` 不是装饰；形态同 :363-366 的既有先例。
      - name: 种子 42 自验（退出码 + stdout 断言）
        run: |
          set -euo pipefail
          python3 -m agenerp.seed --seed 42 --verify | tee /tmp/seed-selfverify.log
          grep -qE '^✅ 种子 42：' /tmp/seed-selfverify.log

  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.1

      # 作用域三个目录逐字照抄 docs/context/project-context.md 的 Lint / static check 一行，
      # 一个字不加不减 —— 尤其不扩到 tests/gates（pyproject.toml 的 [tool.ruff] exclude 已排除它，
      # 理由是免得 lint 逼着去改裁判）。
      # tests/gates 由 pyproject 的 exclude + force-exclude 挡在外面（红线内，
      # 免得 lint 逼着去改裁判）。其余目录一律扫。
      - name: ruff check（agenerp + tests/ 全部非门禁目录）
        run: ruff check agenerp tests/unit tests/contracts tests/tools tests/routing tests/context tests/experiments

  # 集合判据（plan 2026-08-23-0337-2，见 docs/architecture/system-baseline.md §14.8）。
  # 与上面的 expected-red-ratchet 并存、判据不同：那个数行数，这个比条目集合。
  # 两者是合取关系 —— 任一红即拦下，不存在「谁赢」的裁量。
  expected-red-superset:
    name: 预期红名单不得新增条目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 新名单必须是旧名单的子集
        run: |
          set -euo pipefail
          FILE=tools/gates/expected-red.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "首次推送，基线即当前"; exit 0
            fi
          fi
          [ -f "$FILE" ] || { echo "❌ 名单文件不存在：$FILE"; exit 1; }
          norm(){ awk '{l=$0; sub(/^[[:space:]]+/,"",l); sub(/[[:space:]]+$/,"",l);
                        if (l!="" && $0 !~ /^#/) print l}' | sort -u; }
          if ! git cat-file -e "$BASE:$FILE" 2>/dev/null; then
            echo "基线里还没有这个文件，跳过"; exit 0
          fi
          OLD=$(git show "$BASE:$FILE" | norm)
          NEW=$(norm < "$FILE")
          T="${RUNNER_TEMP:-/tmp}"
          printf '%s' "$OLD" > "$T/old.set"; printf '%s' "$NEW" > "$T/new.set"
          ADDED=$(comm -13 "$T/old.set" "$T/new.set")
          [ -z "$ADDED" ] && { echo "✅ 名单未新增条目"; exit 0; }
          echo "本次改动往预期红名单里新增了以下条目："
          echo "$ADDED" | while IFS= read -r e; do echo "   + $e"; done
          if git log --format=%B "$BASE..$HEAD" | grep -q '^Gates-Change-Approved-By:'; then
            echo "✅ 有人工批准 trailer，放行"; exit 0
          fi
          echo "❌ 预期红名单新增了条目——这等于把一个真失败登记成「预期」。"
          echo "   棘轮只允许删，不允许增（等长交换也是增）。确需放宽由人批准：Gates-Change-Approved-By: <姓名>"
          exit 1
