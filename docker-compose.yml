# AgenERP · 零依赖启动栈（roadmap 工作项 3 的交付物）
#
# 目标：`git clone && docker compose up -d` 在**一个环境变量都没配**的机器上也能起来。
# 判据：`docker compose -f docker-compose.yml config -q` 在空环境下退 0
#       （门禁 tests/gates/test_zero_dep_boot.py::test_compose_config_valid_with_empty_env）。
#
# 三条写作规则来自 docs/architecture/system-baseline.md §14（Spike 10 实测结论）：
#   ① 禁止 compose 的**硬失败插值语法**（变量名后跟冒号加问号的那种），一律 `${VAR:-默认值}`
#      —— 一个必填变量就能让 `clone && up` 失败。本文件全文不出现那两个字符的组合，判据就是文本扫描；
#   ② 外部能力（LLM 等）缺失是「未配置」状态，不是错误状态 —— 空默认值，且不进 healthcheck/command 的成败路径；
#   ③ 前置检查属于 verify 脚本，不属于启动路径。
# 这三条已固化成可执行判据：tests/unit/test_compose_zero_dep.py。
#
# ⚠️ 默认口令（DB `changeit` / Administrator `admin`）**只供本地零依赖启动**。
#    对冲手段是 §14「附带风险」段点名的两个之一：**所有端口只绑 127.0.0.1**，宿主 IP 字面写死、不经变量
#    （经变量会被仓根的 .env 改掉，而单测是静态文本扫描，管不到 .env）。
#    **对外暴露前必须改口令，并自行决定绑定地址。**
#
# 镜像版本来源（2026-08-21 查 Docker Hub tags API 确认存在，不用 `latest`）：
#   frappe/erpnext:v15.119.3 · mariadb:10.6 · redis:6.2-alpine
# 升级时该跑什么：改完 tag 后依次跑
#   docker compose -f docker-compose.yml config -q
#   python3 -m pytest tests/unit/test_compose_zero_dep.py -q
#   python3 -m pytest tests/unit/test_explain_same_origin.py -q
#   python3 -m pytest tests/gates/test_zero_dep_boot.py::test_compose_config_valid_with_empty_env -q
# ⚠️ 升级 frappe/erpnext 的 tag 时**还要多跑一条**：本仓维护着一份上游 nginx 模板的副本
#   （tools/nginx/frappe.conf.template，理由见 module-boundaries.md §7.21 D-b-1）。
#   它与上游的分叉是**静默的** —— nginx -t 不会报，栈照样起，只有被上游改掉的那条路由行为不同。
#   唯一的对冲是 tag 钉死 + 这条 diff，期望差集只有本仓那两段 AgenERP 哨兵块：
#     docker run --rm --entrypoint cat frappe/erpnext:<新 tag> \
#       /templates/nginx/frappe.conf.template | diff - tools/nginx/frappe.conf.template
#
# 不写顶层 `version:`：compose v2+ 已弃用该键（实测是告警不是报错，规则仍保留）。

x-erpnext-image: &erpnext_image
  image: frappe/erpnext:v15.119.3

x-backend-defaults: &backend_defaults
  <<: *erpnext_image
  restart: on-failure
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully
    # 等站点建完再起。见 system-baseline.md §14.2：建站耗时随机器速度变，
    # 塞进 backend 探针的 start_period 会让超时值跟着机器猜、也让真坏掉的 backend 更晚翻红。
    # 代价：本锚点为 backend 与三个 worker 共用，三个 worker 的启动时机被一并推迟。
    create-site:
      condition: service_completed_successfully

# AI 能力：全部空默认值。缺失 = 「未配置」，不是错误。
# 这些变量只做环境注入，**不出现在任何 healthcheck 或 command 的成败路径上**。
x-ai-env: &ai_env
  AGENERP_LLM_ENDPOINT: ${AGENERP_LLM_ENDPOINT:-}
  AGENERP_LLM_API_KEY: ${AGENERP_LLM_API_KEY:-}
  AGENERP_LLM_MODEL: ${AGENERP_LLM_MODEL:-}

services:
  db:
    image: mariadb:10.6
    restart: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${AGENERP_DB_PASSWORD:-changeit}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost --password="$$MYSQL_ROOT_PASSWORD"
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - redis-queue-data:/data

  # 一次性：把 db/redis 地址写进 common_site_config.json，写完即退出。
  configurator:
    <<: *erpnext_image
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # 一次性：建站并装 erpnext。已存在则跳过，使重复 `up -d` 幂等。
  create-site:
    <<: *erpnext_image
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        if [ -f sites/frontend/site_config.json ]; then
          echo "site 'frontend' 已存在，跳过建站";
          exit 0;
        fi;
        bench new-site
        --no-mariadb-socket
        --db-root-password "$$DB_ROOT_PASSWORD"
        --admin-password "$$ADMIN_PASSWORD"
        --install-app erpnext
        --set-default frontend;
    environment:
      DB_ROOT_PASSWORD: ${AGENERP_DB_PASSWORD:-changeit}
      ADMIN_PASSWORD: ${AGENERP_ADMIN_PASSWORD:-admin}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # 一次性：把「AI 能力未配置」写进 Website Settings.banner_html，写完即退出。
  # 幂等：横幅内容已是目标值就跳过（脚本自己判），使重复 `up -d` 不重复写、不报错。
  # 口径与残余风险见 docs/architecture/system-baseline.md §14.3。
  bootstrap-homepage:
    <<: *erpnext_image
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        cd sites;
        ../env/bin/python /opt/agenerp/bootstrap/homepage_notice.py;
    environment:
      # 引导脚本读 AGENERP_LLM_ENDPOINT 决定写哪一版文案。它**不在成败路径上**：
      # 变量为空是正常状态，脚本照样退 0（§14 规则 ②）。
      <<: *ai_env
      # 站点名。与 create-site 的 --set-default、frontend 的 FRAPPE_SITE_NAME_HEADER、
      # backend 探针的 Host 头是同一个值 —— 改站点名要这四处一起改。
      AGENERP_SITE_NAME: frontend
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      # 本仓唯一的 bind mount。宿主侧路径**字面写死相对路径**、不许写成变量：
      # 判据是对本文件的静态文本扫描，而仓根 .env 能在 config 时把变量改掉 ——
      # 与上面「端口的宿主 IP 字面写死」是同一条理由（§14.1）。
      - ./tools/bootstrap:/opt/agenerp/bootstrap:ro
    depends_on:
      create-site:
        condition: service_completed_successfully

  backend:
    <<: *backend_defaults
    environment:
      <<: *ai_env
    # Host 头不能省：gunicorn 按 Host 解析站点，打 127.0.0.1 会被当成一个叫 127.0.0.1 的站点而 404。
    # 站点名与 create-site 的 --set-default、frontend 的 FRAPPE_SITE_NAME_HEADER 是同一个值。
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --max-time 5 -H "Host: frontend" -o /dev/null http://127.0.0.1:8000/api/method/ping'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  websocket:
    <<: *erpnext_image
    restart: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    # 根路径 / 实测不回应（curl 5 秒超时、0 字节），只有 socket.io 的握手端点可判活。
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --max-time 5 -o /dev/null "http://127.0.0.1:9000/socket.io/?EIO=4&transport=polling"'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *backend_defaults
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      <<: *ai_env

  queue-long:
    <<: *backend_defaults
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      <<: *ai_env

  scheduler:
    <<: *backend_defaults
    command:
      - bench
      - schedule
    environment:
      <<: *ai_env

  # 解释服务的 HTTP 面（P1.8a）。进程与端点本身见 module-boundaries.md §7.20，
  # 接线（本块 + frontend 的两处 + tools/nginx/）见 §7.21。
  #
  # ⚠️ 刻意**不复用 x-backend-defaults、不挂 sites / logs 卷**：镜像 entrypoint 每次启动都
  #    `rm -rf sites/assets` 再重建软链（实读 /usr/local/bin/entrypoint.sh），挂了就会在
  #    每次重启时抖掉 frontend 的 /assets。本服务不读站点文件，没有挂的理由。
  # ⚠️ **没有 ports: 块，这是刻意的**：`AGENERP_SERVE_HOST: "0.0.0.0"` 的含义是
  #    「本容器的全部网卡」，而本容器只在 compose 的默认 bridge 网络上 ——
  #    「容器内绑 0.0.0.0 ≠ 对本机之外提供」这条论证的**唯一支点**就是这里没有 ports:。
  #    对外那格端口仍然只有 frontend 那一条。判据：tests/unit/test_explain_same_origin.py ①
  agenerp-serve:
    <<: *erpnext_image
    restart: on-failure
    command:
      - python3
      - -m
      - agenerp.serve
    environment:
      # AI 变量全部空默认值（§14 规则 ②）。缺失 = 「未配置」不是错误：服务照常起、
      # /agenerp/health 恒 200，只有真去调模型的那一刻才回 503 并指名缺哪个变量。
      <<: *ai_env
      # 站点名。与 create-site 的 --set-default、frontend 的 FRAPPE_SITE_NAME_HEADER、
      # backend 探针的 Host 头、下面那行回程地址是**同一族值** —— 改站点名要这五处一起改。
      # `:-` 默认值不可省：agenerp/serve/__main__.py 逐字「站点名为空即 return 2」，
      # 省了会让空环境下容器直接退 2、`up --wait` 挂在起栈上。
      AGENERP_SITE: ${AGENERP_SITE:-frontend}
      # 回程地址**字面写死，不许写成 ${AGENERP_SITE_URL:-...}**（§7.21 D-b-3 ③）：
      # .github/workflows/gates.yml 的 gates-l2-seed 有一块 job 级 env 含
      # AGENERP_SITE_URL: http://127.0.0.1:8080，会被它那步 `up -d --wait` 一并继承 ——
      # 插值形式会让本容器**打自己**，而 /agenerp/health 恒 200 ⇒ healthcheck 与
      # `up --wait` 照样绿，只有 /agenerp/explain 静默打不到站点。绿着坏掉，最难发现。
      AGENERP_SITE_URL: http://frontend:8080
      # 监听端口与地址**字面写死**（§7.21 D-b-2 的外推）：判据③ 比的就是这个端口值与
      # tools/nginx/frappe.conf.template 里上游那一行，写成插值时仓根 .env 能在 config
      # 时把它改掉而静态判据看不见。
      AGENERP_SERVE_PORT: "8330"
      # 绑全部网卡 —— nginx 在**另一个容器**里，绑回环它就到不了（§7.21 D-b-4）。
      # 代码侧的**默认值仍是 127.0.0.1**，这里是显式配置，不是改默认。
      AGENERP_SERVE_HOST: "0.0.0.0"
      PYTHONPATH: /opt/agenerp
    volumes:
      # 宿主侧与容器侧**两边都字面写死**，理由同 bootstrap-homepage 那条挂载（§14.1）。
      - ./agenerp:/opt/agenerp/agenerp:ro
    # 探针打 /agenerp/health（恒 200、不认人、不碰 LLM、不打站点），**不打 /agenerp/explain**：
    # 后者认人碰站点，拿它做探针等于让「AI 未配置」把服务判成不健康 —— 正是规则 ② 要挡的。
    # start_period 刻意不抄 backend 的 60s（那 60s 是给建站留的），依据见 §7.21 D-b-6 ③。
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8330/agenerp/health'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # 只等建站完成。**刻意不依赖 frontend**（会与 frontend depends_on agenerp-serve 成环），
    # 也不依赖 backend（本服务启动时不打站点，create-site 已隐含 configurator）。
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: *erpnext_image
    restart: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    # nginx 自己带 FRAPPE_SITE_NAME_HEADER，探针不用手加 Host 头。
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/api/method/ping'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      # 同源那一跳（§7.21 D-b-1 候选 A）：覆盖上游那份 nginx 模板，让它多出一段
      # `location /agenerp/`。上游 nginx-entrypoint.sh **一个字不动**，照常 envsubst 生成
      # /etc/nginx/conf.d/frappe.conf 再 `nginx -g 'daemon off;'`。
      # 宿主侧路径字面写死，理由同上面 bootstrap-homepage 那条挂载。
      # ⚠️ 这是**上游文件的副本**，钉在 x-erpnext-image 那个 tag 上。升级 tag 时必须跑
      #    文件头写的那条 diff —— 分叉是静默的，nginx -t 不会报、栈照样起。
      - ./tools/nginx/frappe.conf.template:/templates/nginx/frappe.conf.template:ro
    # 宿主 IP 字面写死 127.0.0.1 —— 见文件头「附带风险」说明。端口号可经变量覆盖，绑定地址不可。
    ports:
      - "127.0.0.1:${AGENERP_HTTP_PORT:-8080}:8080"
    # 两个依赖都落了 healthcheck，故一律 service_healthy。
    # service_started 只保证容器起来，实测会让 nginx 在 backend 可解析之前启动并逐字报
    # `host not found in upstream "backend:8000"`，陷入重启循环。
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
      # 首页横幅必须先写进去，nginx 再开始对外服务 —— 否则第一个访客可能正好落在
      # 「站点起来了但还没说 AI 未配置」的窗口里。
      # 还有一个**编排层的硬理由**：`up -d --wait` 会把「没有任何服务以
      # service_completed_successfully 依赖它」的一次性容器的正常退出当成失败（实测退 1，
      # 逐字 `container agenerp-bootstrap-homepage-1 exited (0)`）。configurator / create-site
      # 不踩这个坑，正是因为它们各自被依赖着。
      bootstrap-homepage:
        condition: service_completed_successfully
      # ⚠️ **这里刻意没有 agenerp-serve** —— 曾经有过，实测是个缺陷，已删（§7.21 `D-b-8`）。
      # 加它挡不住那个失败形态（depends_on 只管 `up` 的次序，不管 `restart: on-failure`
      # 触发的重启），却把 frontend 的可用性绑在一个它其实不需要的服务上。
      # 真正的修法在 nginx 侧：resolver + 变量形式的 proxy_pass，改成**每次请求时**解析
      # ⇒ agenerp-serve 不在时只有 /agenerp/ 那一条回 502，Frappe 本身照常对外。

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
