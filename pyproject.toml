[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenerp"
version = "0.0.0"
description = "Agent-driven ERP on Frappe/ERPNext"
requires-python = ">=3.11"
# 运行期依赖。**此前一个都没声明** —— 本机碰巧装着 certifi，所以直到
# 2026-08-24 把 tests/routing 接进 CI 才暴露（runner 上 ModuleNotFoundError）。
# certifi 不是可选项：D-11 记着本机 python.org 版 Python 未装 CA 根证书，
# 直连 HTTPS 报 CERTIFICATE_VERIFY_FAILED，产品代码必须显式用它建 SSL 上下文。
dependencies = [
    "certifi>=2024.2.2",
]

# 可选依赖。**装 agenerp 默认一个都不装** —— `pip install agenerp` 得到的仍是
# 上面那一条 certifi。这是 `system-baseline.md` §3.3.3 那条硬约束的兑现：
# 「内置 runtime 必须纯 Python、零外部依赖，保证 `git clone && docker compose up` 可跑」。
[project.optional-dependencies]
# ui —— 浏览器驱动，只给 UI 门禁用（人 2026-08-26 批准，见 DECISIONS.md D-25）。
# 为什么需要它：P1.8b 的验收逐字是 `pytest -m live tests/ui/test_sidebar.py`，
# 而「按下 ⌘K 之后发生了什么」**没有真浏览器就验不了**。本项目最硬的一条口径是
# 「一条会 skip 的门禁等于一条不存在的门禁」—— 验不了的门禁同理。
# ⚠️ 装了包还要装浏览器二进制：`python -m playwright install chromium`。
#    只 pip install 不装二进制，测试会在运行期报 Executable doesn't exist。
ui = [
    "playwright>=1.47",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agenerp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 扁平布局：让裸 `pytest` 与 `python3 -m pytest` 两种跑法都能 import agenerp。
# （`-m` 形式本来就把 CWD 插进 sys.path，裸 pytest 不会。）
pythonpath = ["."]
markers = [
  "live: 需要活站点 / docker 的慢门禁（L2）。L1 快门禁跑 `-m 'not live'`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# tests/gates/** 在红线内，loop 不得修改；exclude 与 force-exclude 一起把它挡在 ruff 之外，
# 免得 lint 逼着去改裁判。门禁判定器是 tools/gates/check_expected_red.py，与 ruff 无关。
# force-exclude 不冗余，别顺手删：单靠 exclude 只在目录遍历时生效，显式传路径（ruff check tests/gates）
# 照样扫裁判并报错；加上它之后目录 / 单文件 / 绝对路径三种形态全部 exit 0。
# 代价照实记：路径被排除时 ruff 静默退 0，只打一行 warning: No Python files found under the given path(s)，
# 「检查过且全过」与「根本没看」在退出码上一样，那行 warning 是唯一肉眼线索，不得被 2>/dev/null 吞掉。
exclude = ["tests/gates"]
force-exclude = true
